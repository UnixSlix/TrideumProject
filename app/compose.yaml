
# Ashby Marriott
# References:
#   - Milvus container setup: https://milvus.io/docs/v2.3.x/install_standalone-docker-compose.md
#   - Several Docker docs examples: https://docs.docker.com/guides/python/develop/ , 
#       https://github.com/docker/awesome-compose, https://docs.docker.com/go/compose-spec-reference/ 
services:

  python-app:
    build: .
    container_name: rag_app
    volumes:
      - .:/app:delegated
    depends_on:
      - milvus
      - ollama
    working_dir: /app
    # a tty to interact with the TUI
    stdin_open: true
    tty: true
    command: [ "sh", "-c", "uvicorn main:app --host 0.0.0.0" ]
    environment:
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - ./corpus
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 4g

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  milvus:
    image: milvusdb/milvus:v2.3.21
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    
    volumes:
      # Ollama models volume
      - ollama_models:/var/lib/models
      # entrypoint script to initialize Ollama and pull llama3.2
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]


volumes:
  ollama_models:
  etcd_data:
  minio_data:
  milvus_data:
